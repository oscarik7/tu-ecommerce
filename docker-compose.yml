version: '3.8'

services:
    app:
        build:
            # ¡Cambiamos el contexto a la carpeta donde están el Dockerfile y sus archivos de soporte!
            context: ./vendor/laravel/sail/runtimes/8.3/ 
            # El Dockerfile se llama solo 'Dockerfile' dentro de ese contexto
            dockerfile: Dockerfile
        container_name: tu_ecommerce_app
        restart: always
        # Monta el código fuente en el contenedor
        volumes:
            - .:/var/www/html
        # Configuración de usuario para evitar problemas de permisos
        user: "${WWWUSER}:${WWWGROUP}"
        # Expone el puerto 9000 para que Nginx se conecte
        expose:
            - '9000'
        # Define la red interna de Docker
        networks:
            - ecommerce-net
        depends_on:
            - db

    # ---------------------------------
    # 2. SERVIDOR WEB (NGINX)
    # ---------------------------------
    web:
        image: nginx:alpine
        container_name: tu_ecommerce_web
        restart: always
        # Mapea el puerto del .env (8001) a tu máquina
        ports:
            - "${NGINX_PORT}:80" # Esto será http://localhost:8001
        volumes:
            # Monta el código fuente y el archivo de configuración de Nginx
            - .:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        networks:
            - ecommerce-net
        depends_on:
            - app

    # ---------------------------------
    # 3. BASE DE DATOS (POSTGRESQL)
    # ---------------------------------
    db:
        image: postgres:16-alpine
        container_name: tu_ecommerce_db
        restart: always
        # Mapea el puerto del .env (3070) a tu máquina
        ports:
            - "${FORWARD_DB_PORT}:5432" # Esto será para conexión externa, ej. DBeaver
        environment:
            # Variables de entorno de PostgreSQL que usa Laravel, tomadas del .env
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        volumes:
            # Persistencia de datos para que la información no se pierda
            - pgsql_data:/var/lib/postgresql/data
        networks:
            - ecommerce-net
        # El nombre del host 'pgsql' que definiste en DB_HOST será resuelto internamente por Docker

    # ---------------------------------
    # 4. ADMIN. DE BASE DE DATOS (PGADMIN)
    # ---------------------------------
    pgadmin:
        image: dpage/pgadmin4
        container_name: tu_ecommerce_pgadmin
        restart: always
        # Mapea el puerto 5050 a tu máquina (un puerto común para PGAdmin)
        ports:
            - '5050:80' # Acceso a PGAdmin en http://localhost:5050
        environment:
            # Credenciales para iniciar sesión en PGAdmin
            PGADMIN_DEFAULT_EMAIL: admin@ecommerce.test
            PGADMIN_DEFAULT_PASSWORD: supersecret
        volumes:
            # Guarda la configuración de los servidores PGAdmin
            - pgadmin_data:/var/lib/pgadmin
        networks:
            - ecommerce-net
        depends_on:
            - db

# Define los volúmenes para la persistencia de datos
volumes:
    pgsql_data:
    pgadmin_data:

# Define la red para que los contenedores se comuniquen entre sí
networks:
    ecommerce-net:
        driver: bridge