# Este bloque redirige todo el tráfico HTTP (puerto 80) a HTTPS
server {
    listen 80;
    server_name tu-ecommerce.com.pu; # <-- Tu dominio aquí

    # Ruta para la renovación de Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/html; # Ajusta si usaste un webroot diferente
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Este bloque maneja el tráfico HTTPS (puerto 443)
server {
    listen 443 ssl;
    server_name tu-ecommerce.com.pu; # <-- Tu dominio aquí
    root /var/www/html/public;

    # --- Rutas a los certificados que montamos ---
    ssl_certificate /etc/letsencrypt/live/tu-ecommerce.com.pu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tu-ecommerce.com.pu/privkey.pem;

    # Configuraciones de seguridad SSL recomendadas
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    # El resto de tu configuración de Laravel
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    index index.php;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass rma-app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }
}